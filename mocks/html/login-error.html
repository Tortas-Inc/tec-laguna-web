<!--
  Fixture sintética — respuesta simulada de POST /StatusAlumno/login.aspx
  Caso: credenciales incorrectas.
  El parser real (Android AuthRepositoryImpl.kt / futuro cheerio parser) solo hace un
  chequeo de substring: html.contains("lblError"). No importa el resto del documento,
  basta con que el id/texto del label de error esté presente en algún punto del HTML.
-->
<!DOCTYPE html>
<html>
<head><title>Sistema de Control Escolar</title></head>
<body>
  <form id="form1" action="login.aspx" method="post">
    <div>
      <input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="..." />
      <input type="hidden" name="__EVENTVALIDATION" id="__EVENTVALIDATION" value="..." />
    </div>
    <table>
      <tr>
        <td>Número de control:</td>
        <td><input name="tbLogin" type="text" id="tbLogin" /></td>
      </tr>
      <tr>
        <td>Contraseña:</td>
        <td><input name="tbPassword" type="password" id="tbPassword" /></td>
      </tr>
      <tr>
        <td colspan="2">
          <span id="MainContent_lblError" style="color:Red;">Usuario o contraseña incorrectos</span>
        </td>
      </tr>
    </table>
    <input type="submit" name="Button2" value="Ingresar" id="Button2" />
  </form>
</body>
</html>
